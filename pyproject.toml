[project]
name = "ha-spool-bridge"
version = "0.1.2"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.372",
  "curl_cffi>=0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a running Spoolman (env SPOOLMAN_URL)"]
